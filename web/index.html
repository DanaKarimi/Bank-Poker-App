<!doctype html>
<html lang="en" style="background:#081C14">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#081C14" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="BankPoker - Real-time poker table ledger, buy-ins, exits, and debt settlements." />
    <title>BankPoker - Poker Ledger &amp; Stats</title>
    <style>
      @keyframes bp-slide {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(260%); }
      }
      .bp-splash {
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        box-sizing: border-box;
        background: radial-gradient(circle at top, #103023 0%, #081C14 70%);
        color: #F4EFE6;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      .bp-card {
        width: 100%;
        max-width: 340px;
        background: #103023;
        border: 1.5px solid rgba(212, 175, 55, 0.55);
        border-radius: 24px;
        padding: 32px 24px;
        text-align: center;
        box-shadow: 0 24px 48px rgba(0, 0, 0, 0.45);
      }
      .bp-emblem {
        width: 64px;
        height: 64px;
        margin: 0 auto 14px;
        border-radius: 18px;
        background: rgba(212, 175, 55, 0.14);
        border: 1.5px solid rgba(212, 175, 55, 0.5);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 34px;
        color: #D4AF37;
      }
      .bp-title {
        margin: 0;
        font-size: 20px;
        font-weight: 900;
        letter-spacing: 0.14em;
        color: #D4AF37;
      }
      .bp-status {
        margin: 14px 0 4px;
        font-size: 14px;
        font-weight: 700;
        color: #F4EFE6;
      }
      .bp-sub {
        margin: 0 0 18px;
        font-size: 12px;
        color: rgba(244, 239, 230, 0.65);
      }
      .bp-bar {
        position: relative;
        height: 6px;
        border-radius: 999px;
        background: #081C14;
        border: 1px solid rgba(212, 175, 55, 0.25);
        overflow: hidden;
      }
      .bp-bar-fill {
        position: absolute;
        inset: 0 auto 0 0;
        width: 42%;
        border-radius: 999px;
        background: linear-gradient(90deg, #B8860B, #EAB308, #D4AF37);
        animation: bp-slide 1.25s ease-in-out infinite;
      }
      .bp-reload {
        display: none;
        margin-top: 18px;
        font-size: 12px;
        font-weight: 700;
        color: #EAB308;
        text-decoration: underline;
      }
    </style>
  </head>
  <body style="background:#081C14;margin:0">
    <div id="root">
      <div class="bp-splash">
        <div class="bp-card">
          <div class="bp-emblem" aria-hidden="true">♠</div>
          <h1 class="bp-title">BANK POKER</h1>
          <p class="bp-status">Loading BankPoker...</p>
          <p class="bp-sub">Downloading app assets, please wait...</p>
          <div class="bp-bar"><div class="bp-bar-fill"></div></div>
          <a id="bp-slow-reload" class="bp-reload" href="javascript:window.location.reload()">Taking longer than usual? Tap to reload</a>
        </div>
      </div>
    </div>
    <script>
      setTimeout(function () {
        var el = document.getElementById('bp-slow-reload');
        if (el) el.style.display = 'inline-block';
      }, 12000);
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
