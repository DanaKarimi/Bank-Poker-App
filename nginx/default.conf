# Connection header mapping for WebSocket / HTTP/1.1 upgrade support
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name localhost _;

    # Maximum payload size (supports database backup imports/exports)
    client_max_body_size 25M;

    # Enable Gzip compression for static assets
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml+rss image/svg+xml;

    # Common reverse proxy header settings
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # API endpoints: disable buffering and caching for live balance & game sync
    location /api/ {
        proxy_pass http://bankpoker:3000;
        proxy_buffering off;
        proxy_cache off;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
        expires -1;
    }

    # Web application: static files, assets, and client-side SPA fallback routes
    location / {
        proxy_pass http://bankpoker:3000;
    }
}
