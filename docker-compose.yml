services:
  # ==============================================================================
  # BankPoker Node.js + Express Backend and React Web Server
  # ==============================================================================
  bankpoker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bankpoker-app
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      - PORT=3000
      - NODE_ENV=production
      - DATABASE_PATH=/app/data/bankpoker.db
      - JWT_SECRET=${JWT_SECRET}
    volumes:
      # Persistent host bind-mount for SQLite database
      - ./data:/app/data
    expose:
      # Exposed internally to the Docker bridge network only (NOT published to host)
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:' + (process.env.PORT || 3000) + '/api/health', (r) => { process.exit(r.statusCode === 200 ? 0 : 1); }).on('error', () => process.exit(1));"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - bankpoker-network

  # ==============================================================================
  # Nginx Reverse Proxy (Frontend entrypoint on port 80)
  # ==============================================================================
  nginx:
    image: nginx:alpine
    container_name: bankpoker-nginx
    restart: unless-stopped
    ports:
      # Only Nginx publishes port 80 to the host network
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      bankpoker:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - bankpoker-network

networks:
  bankpoker-network:
    driver: bridge
